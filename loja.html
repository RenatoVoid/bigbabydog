<!-- ============================================================
     LOJA.HTML - Catálogo de produtos BIGBABYDOG
     Grid responsivo, carregamento dinâmico via Supabase
     ============================================================ -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja - BIGBABYDOG</title>
    
    <!-- Fontes Google (Orbitron + Rajdhani) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Ícones Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Estilos globais (cyberpunk) -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- ========== NAVBAR ========== -->
    <nav class="navbar">
        <a href="index.html" class="nav-logo">
            <i class="fas fa-dog"></i> BIGBABYDOG
        </a>
        
        <button class="menu-toggle" aria-label="Menu">
            <i class="fas fa-bars"></i>
        </button>
        
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="loja.html" class="active">Loja</a></li>
            <li><a href="index.html#sobre">Sobre</a></li>
            <li>
                <!-- Botão do carrinho (aciona o modal via função global) -->
                <button class="nav-cart" onclick="window.carrinho.abrir()" aria-label="Carrinho">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="cart-count" id="cartCount" style="display:none">0</span>
                </button>
            </li>
        </ul>
    </nav>

    <!-- ========== CONTEÚDO PRINCIPAL ========== -->
    <main style="padding: 100px 20px 60px;">
        <div class="container">
            
            <!-- Título da seção -->
            <h1 class="section-title" style="text-align:left;">NOSSA <span>COLEÇÃO</span></h1>
            
            <!-- Container onde os cards de produtos serão injetados -->
            <div id="lista-produtos" class="produtos-grid">
                <!-- Mensagem temporária enquanto carrega -->
                <p style="text-align:center;color:var(--text-muted);grid-column:1/-1;">Carregando produtos...</p>
            </div>
            
        </div>
    </main>

    <!-- ========== FOOTER ========== -->
    <footer class="footer">
        <div class="social-icons">
            <a href="#" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
            <a href="#" aria-label="TikTok"><i class="fab fa-tiktok"></i></a>
            <a href="#" aria-label="WhatsApp"><i class="fab fa-whatsapp"></i></a>
        </div>
        <p>© 2024 BIGBABYDOG - Todos os direitos reservados</p>
    </footer>

    <!-- ========== SCRIPT PRINCIPAL (módulo ES) ========== -->
    <!-- O main.js contém a função carregarProdutos() que alimenta #lista-produtos -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
