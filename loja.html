<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja - BIGBABYDOG</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- ========== NAVBAR ========== -->
    <nav class="navbar">
        <a href="index.html" class="nav-logo">BIGBABYDOG</a>
        <button class="menu-toggle" id="menuToggle" aria-label="Menu">
            <i class="fas fa-bars"></i>
        </button>
        <ul class="nav-links" id="navLinks">
            <li><a href="index.html">Home</a></li>
            <li><a href="loja.html" class="active">Loja</a></li>
            <li><a href="sobre.html">Sobre</a></li>
            <li>
                <button class="nav-cart" onclick="window.carrinho?.abrir()" aria-label="Carrinho">
                    <i class="fas fa-shopping-bag"></i>
                    <span class="cart-count" id="cartCount">0</span>
                </button>
            </li>
        </ul>
    </nav>

    <!-- ========== CONTEÚDO PRINCIPAL ========== -->
    <main style="padding: 100px 20px 60px;">
        <div class="container">

            <h1 class="section-title" style="text-align:left; margin-bottom:8px;">
                Nossa <span>coleção</span>
            </h1>
            <p style="color:var(--text-muted); margin-bottom:30px; font-size:0.95rem;">
                Encontre a peça perfeita para o seu estilo
            </p>

            <!-- Barra de busca e filtros -->
            <div class="filtros-bar">
                <input type="text" id="buscaInput" class="busca-input" placeholder="Buscar produtos...">
                <div style="display:flex; flex-wrap:wrap; gap:8px;">
                    <button class="filtro-btn active" data-categoria="todos">Todos</button>
                    <button class="filtro-btn" data-categoria="camiseta">Camisetas</button>
                    <button class="filtro-btn" data-categoria="calca">Calças</button>
                    <button class="filtro-btn" data-categoria="moletom">Moletons</button>
                    <button class="filtro-btn" data-categoria="tenis">Tênis</button>
                    <button class="filtro-btn" data-categoria="acessorio">Acessórios</button>
                </div>
            </div>

            <!-- Grid de produtos -->
            <div class="produtos-grid" id="catalogoGrid">
                <div style="grid-column:1/-1; text-align:center; padding:40px; color:var(--text-muted);">
                    <i class="fas fa-spinner fa-spin" style="font-size:2rem;"></i>
                    <p style="margin-top:10px;">Carregando produtos...</p>
                </div>
            </div>

        </div>
    </main>

    <!-- ========== FOOTER ========== -->
    <footer class="footer">
        <div class="social-icons">
            <a href="#"><i class="fab fa-instagram"></i></a>
            <a href="#"><i class="fab fa-tiktok"></i></a>
            <a href="#"><i class="fab fa-whatsapp"></i></a>
        </div>
        <p>© 2024 BIGBABYDOG - Todos os direitos reservados</p>
    </footer>

    <!-- ========== SCRIPTS ========== -->
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
        const SUPABASE_URL = 'https://lekzyptgypjkwpxuruel.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_9z5CfPvDD0XEK9RglCOh5w_VE_F9D4H';
        window.supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        console.log('🔥 Supabase inicializado na loja');

        await import('./js/carrinho.js');
        await import('./js/loja.js');

        // Mobile menu toggle
        document.addEventListener('DOMContentLoaded', () => {
            const toggle = document.getElementById('menuToggle');
            const links = document.getElementById('navLinks');
            if (toggle && links) {
                toggle.addEventListener('click', () => {
                    links.classList.toggle('open');
                });
            }
        });
    </script>

</body>
</html>
