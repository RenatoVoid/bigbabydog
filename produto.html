<!-- ============================================================
     PRODUTO.HTML - Página individual do produto
     ============================================================ -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produto - BIGBABYDOG</title>

    <!-- Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Estilos globais -->
    <link rel="stylesheet" href="css/style.css">

    <style>
        .produto-loading { text-align: center; padding: 60px 20px; color: var(--text-muted); }
        .produto-loading i { font-size: 2.5rem; margin-bottom: 16px; display: block; }
        .produto-erro { text-align: center; padding: 60px 20px; color: var(--text-muted); }
        .produto-erro i { font-size: 3rem; color: var(--accent); margin-bottom: 16px; display: block; }
        .produto-erro .btn { margin-top: 20px; }
        @media (max-width: 768px) {
            .produto-detalhe { padding-top: 80px; }
        }
    </style>
</head>
<body>

    <!-- ========== NAVBAR ========== -->
    <nav class="navbar">
        <a href="index.html" class="nav-logo">BIGBABYDOG</a>
        <button class="menu-toggle" id="menuToggle" aria-label="Menu">
            <i class="fas fa-bars"></i>
        </button>
        <ul class="nav-links" id="navLinks">
            <li><a href="index.html">Home</a></li>
            <li><a href="loja.html">Loja</a></li>
            <li><a href="index.html#sobre">Sobre</a></li>
            <li>
                <button class="nav-cart" onclick="window.carrinho?.abrir()" aria-label="Carrinho">
                    <i class="fas fa-shopping-bag"></i>
                    <span class="cart-count" id="cartCount">0</span>
                </button>
            </li>
        </ul>
    </nav>

    <!-- ========== CONTEÚDO PRINCIPAL ========== -->
    <main>
        <div id="produtoContainer">
            <!-- Loading -->
            <div id="loadingProduto" class="produto-loading">
                <i class="fas fa-spinner fa-spin"></i>
                <p>Carregando produto...</p>
            </div>

            <!-- Erro -->
            <div id="erroProduto" class="produto-erro" style="display:none;">
                <i class="fas fa-exclamation-triangle"></i>
                <p>Produto não encontrado.</p>
                <a href="loja.html" class="btn btn-outline">Voltar à loja</a>
            </div>

            <!-- Detalhe do produto -->
            <div id="detalheProduto" class="produto-detalhe" style="display:none;">
                <!-- Galeria -->
                <div class="produto-galeria">
                    <img id="galeriaPrincipal" src="" alt="" class="galeria-principal">
                    <div class="galeria-thumbs" id="galeriaThumbs"></div>
                </div>

                <!-- Informações -->
                <div class="produto-info">
                    <div class="produto-cat" id="produtoCategoria"></div>
                    <h1 id="produtoNome"></h1>
                    <div class="produto-preco">
                        <span id="produtoPreco"></span>
                        <s id="produtoPrecoAntigo" style="display:none;"></s>
                    </div>
                    <div id="produtoBadges" style="margin-bottom:16px;"></div>
                    <div class="produto-desc" id="produtoDescricao"></div>

                    <!-- Tamanhos -->
                    <div class="tamanho-selector">
                        <h3>SELECIONE O TAMANHO <span style="color:var(--accent);">*</span></h3>
                        <div class="tamanho-opcoes" id="tamanhoOpcoes"></div>
                    </div>

                    <!-- Comprar -->
                    <button class="btn-comprar" id="btnComprar" disabled>
                        <i class="fas fa-shopping-cart"></i> SELECIONE UM TAMANHO
                    </button>
                </div>
            </div>
        </div>

        <!-- Sugestões -->
        <section class="container" style="padding: 40px 20px 60px;">
            <h3 class="section-title">Quem comprou <span>também levou</span></h3>
            <div class="produtos-grid" id="sugestoesGrid"></div>
        </section>
    </main>

    <!-- ========== FOOTER ========== -->
    <footer class="footer">
        <div class="social-icons">
            <a href="#"><i class="fab fa-instagram"></i></a>
            <a href="#"><i class="fab fa-tiktok"></i></a>
            <a href="#"><i class="fab fa-whatsapp"></i></a>
        </div>
        <p>© 2024 BIGBABYDOG - Todos os direitos reservados</p>
    </footer>

    <!-- ========== SCRIPTS ========== -->
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
        const SUPABASE_URL = 'https://lekzyptgypjkwpxuruel.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_9z5CfPvDD0XEK9RglCOh5w_VE_F9D4H';
        window.supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        console.log('✅ Supabase inicializado');
        await import('./js/carrinho.js');
        await import('./js/produto.js');
    </script>

</body>
</html>
